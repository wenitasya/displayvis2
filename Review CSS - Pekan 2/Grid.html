<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <title>CSS Grid Dasar</title>
    <style>
      body {
        font-family: sans-serif;
        background-color: #f1f1f1;
        padding: 20px;
      }

      .container {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr 1fr;
        grid-template-rows: auto auto;
        gap: 20px;
      }

      .item {
        background-color: #2ecc71;
        color: white;
        font-weight: bold;
        padding: 20px;
        text-align: center;
        border-radius: 8px;
      }

      .container2 {
        display: grid;
        grid-template-rows: 1fr 1fr;
        grid-template-columns: auto auto;
        gap: 20px;
      }

      .item2 {
        background-color: #50e4fe;
        color: white;
        font-weight: bold;
        padding: 20px;
        text-align: center;
        border-radius: 8px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="item">Item 1</div>
      <div class="item">Item 2</div>
      <div class="item">Item 3</div>
      <div class="item">Item 4</div>
      <div class="item">Item 5</div>
      <div class="item">Item 6</div>
      <div class="item">Item 7</div>
    </div>
    <br />
    <div class="container2">
      <div class="item2">Item 7</div>
      <div class="item2">Item 8</div>
      <div class="item2">Item 9</div>
      <div class="item2">Item 10</div>
      <div class="item2">Item 11</div>
      <div class="item2">Item 12</div>
      <div class="item2">Item 13</div>
    </div>
  </body>
</html>

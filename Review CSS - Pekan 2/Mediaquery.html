<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contoh Media Query</title>

    <style>
      body {
        font-family:
          "Gill Sans", "Gill Sans MT", Calibri, "Trebuchet MS", sans-serif;
        margin: 30px;
      }

      .kotak {
        width: 500px;
        padding: 30px;
        background-color: rgb(243, 12, 12);
        text-align: center;
      }

      /* Untuk layar dengan lebar maksimal 600px */
      @media (max-width: 600px) {
        .kotak {
          width: auto;
          background-color: lightgreen;
        }

        body {
          margin: 15px;
        }
      }
    </style>
  </head>

  <body>
    <h1>Contoh Media Query</h1>

    <div class="kotak">
      <h2>Responsive Design</h2>
      <p>Coba kecilkan ukuran browser untuk melihat perubahan.</p>
    </div>
  </body>
</html>
